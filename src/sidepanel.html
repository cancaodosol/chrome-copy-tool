<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>コピー履歴</title>
    <link rel="stylesheet" href="./tailwind.css" />
  </head>
  <body class="bg-neutral-50 text-neutral-900">
    <aside class="min-h-screen px-2 py-3">
      <header class="space-y-1.5 border-b border-neutral-200 pb-3">
        <h1 class="text-lg font-semibold tracking-tight">コピー履歴</h1>
        <p class="text-xs text-neutral-500">選択テキストをURL付きで記録</p>
      </header>

      <div class="mt-3">
        <div class="flex gap-1 py-1 px-[1.5px] text-xs">
          <button id="tab-memos" class="relative z-0 rounded-md rounded-b-none border border-neutral-900 border-b-0 px-3 py-1 font-[550] text-neutral-900">メモ</button>
          <button id="tab-domains" class="relative z-0 rounded-md rounded-b-none border border-neutral-200 border-b-0 px-3 py-1 text-neutral-600">ドメイン</button>
        </div>
        <div id="tab-divider" class="relative z-10 border-b border-neutral-900" style="margin-top: -5px;"></div>
      </div>

      <main class="pt-3">
        <section id="memo-view" class="space-y-2.5">
          <div id="filter-bar" class="hidden items-center justify-between rounded-md border border-neutral-200 bg-white px-2 py-1 text-[11px]">
            <span id="filter-label" class="text-neutral-600"></span>
            <button id="clear-filter" class="text-neutral-500 hover:text-neutral-700">全件に戻る</button>
          </div>

          <section id="empty-state" class="hidden rounded-lg border border-dashed border-neutral-300 bg-white p-3 text-center">
            <p id="empty-title" class="text-xs text-neutral-600">まだメモがありません</p>
            <p id="empty-subtitle" class="mt-1.5 text-[11px] text-neutral-500">テキスト選択 → ショートカットで保存</p>
          </section>

          <section id="memo-list" class="space-y-2.5"></section>
        </section>

        <section id="domain-view" class="hidden space-y-2.5">
          <section id="domain-empty" class="hidden rounded-lg border border-dashed border-neutral-300 bg-white p-3 text-center">
            <p class="text-xs text-neutral-600">ドメインがありません</p>
          </section>
          <section id="domain-list"></section>
        </section>
      </main>

      <div id="delete-modal" class="fixed inset-0 hidden items-center justify-center bg-black/30 px-4">
        <div class="w-full max-w-xs rounded-lg border border-neutral-200 bg-white p-4 text-xs text-neutral-800 shadow-lg">
          <p class="font-semibold text-neutral-900">このメモを削除しますか？</p>
          <label class="mt-3 flex items-center gap-2 text-neutral-600">
            <input id="delete-skip" type="checkbox" class="h-3.5 w-3.5 rounded border-neutral-300 text-neutral-900" />
            次回から確認しない
          </label>
          <div class="mt-4 flex justify-end gap-2">
            <button id="delete-cancel" class="rounded-md border border-neutral-200 px-3 py-1 text-neutral-600">キャンセル</button>
            <button id="delete-confirm" class="rounded-md bg-neutral-900 px-3 py-1 font-semibold text-neutral-100">削除</button>
          </div>
        </div>
      </div>

      <footer class="mt-4 border-t border-neutral-200 pt-3">
        <p id="shortcut-hint" class="text-[11px] text-neutral-500">ショートカット: -</p>
      </footer>
    </aside>

    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
